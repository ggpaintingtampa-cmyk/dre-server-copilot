kind = "api"
previewPath = "/api"
title = "DRE Agent API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "DRE_STATE_DB_PATH=/tmp/dre-copilot/state.sqlite3 python -m uvicorn fastapi_app:app --app-dir artifacts/api-server --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["sh", "-c", "sh scripts/build-dre-production.sh"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["sh", "-c", "python -m uvicorn fastapi_app:app --app-dir artifacts/api-server --host 0.0.0.0 --port $PORT"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
