name: Build DRE Small v1.3 Research

on:
  workflow_dispatch:
  push:
    paths:
      - image-research-autostart/Dockerfile
      - .github/workflows/build-dre-small-v1.3-research.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./image-research-autostart
          push: true
          tags: ghcr.io/ggpaintingtampa-cmyk/dre-small:v1.3-research
