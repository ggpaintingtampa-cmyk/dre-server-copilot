name: Build DRE SMALL vNext

on:
  push:
    branches:
      - dre-vnext-integration

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DRE SMALL vNext
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/image/Dockerfile
          push: true
          tags: |
            ghcr.io/ggpaintingtampa-cmyk/dre-small:vnext
            ghcr.io/ggpaintingtampa-cmyk/dre-small:0a101d0
